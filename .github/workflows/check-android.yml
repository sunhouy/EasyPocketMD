name: Check Android app
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/*android*'
      - '.github/workflows/check-android.yml'
permissions:
  contents: read
concurrency:
  group: check-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v4
      - name: Install Android components
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.57
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.57
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run wasm:text:build
      - run: npx tauri icon src-tauri/icon-rgba.png
      - run: npm run tauri:android:init
      - name: Apply application configuration
        run: |
          bash scripts/apply-android-config.sh
          bash scripts/configure-android-permissions.sh
      - name: Compile debug APK without release signing
        run: npx tauri android build --debug --apk --target aarch64
