name: CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布到 GitHub Release 的 tag（例如 v1.2.3；留空则使用当前 ref 的 tag）'
        required: false
        type: string
      action:
        description: '选择操作类型'
        required: false
        type: choice
        default: 'deploy'
        options:
          - deploy
          - rollback

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  REMOTE_NODE_BIN: '/www/server/nodejs/v24.14.1/bin'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup Emscripten
      run: |
        if [ ! -d "$HOME/emsdk" ]; then
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
        fi
        cd "$HOME/emsdk"
        ./emsdk install 3.1.57
        ./emsdk activate 3.1.57
        echo "$HOME/emsdk" >> "$GITHUB_PATH"
        echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Build WASM text engine
      run: npm run wasm:text:build

    - name: Build WASM image compressor
      run: npm run wasm:image:build

    - name: Verify WASM source artifacts
      run: npm run wasm:text:verify && npm run wasm:image:verify

    - name: Build and verify isolated Python runner
      run: |
        bash scripts/setup-python-sandbox.sh --build
        npx tsx scripts/check-python-sandbox.ts
        bash scripts/export-python-sandbox.sh "$RUNNER_TEMP/python-sandbox-image"
        bash scripts/setup-python-sandbox.sh --load "$RUNNER_TEMP/python-sandbox-image/python-sandbox.tar.gz"

    - name: Verify sandbox image in a separate Docker engine
      timeout-minutes: 5
      run: bash scripts/check-sandbox-image-portability.sh "$RUNNER_TEMP/python-sandbox-image"

    - name: Upload verified Python sandbox image
      uses: actions/upload-artifact@v4
      with:
        name: python-sandbox-image
        path: ${{ runner.temp }}/python-sandbox-image/
        compression-level: 0
        retention-days: 3
        if-no-files-found: error

    - name: Run tests
      run: npm test -- --coverage

    - name: Verify locked production dependencies
      run: |
        RUNTIME_DIR="$RUNNER_TEMP/easypocketmd-runtime"
        mkdir -p "$RUNTIME_DIR"
        cp package.json package-lock.json "$RUNTIME_DIR/"
        npm ci --prefix "$RUNTIME_DIR" --omit=dev --prefer-offline --no-audit --no-fund
        cd "$RUNTIME_DIR"
        ./node_modules/.bin/tsx --version
        node -e "require('sharp'); require('esbuild').transformSync('const n: number = 1', {loader: 'ts'});"

    - name: Verify frontend build
      run: npm run build:web && npm run wasm:text:verify:dist && npm run wasm:image:verify:dist

    
        
  deploy:
    timeout-minutes: 45
    concurrency:
      group: easypocketmd-server-deployment
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    needs: test
    if: github.ref == 'refs/heads/main' && github.event.inputs.action != 'rollback'

    steps:
    - name: Checkout source
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Extract package version
      id: app_version
      run: |
        APP_VERSION=$(node -p "require('./package.json').version")
        echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
        echo "Deploying app version: $APP_VERSION"


    - name: Setup Emscripten
      run: |
        if [ ! -d "$HOME/emsdk" ]; then
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
        fi
        cd "$HOME/emsdk"
        ./emsdk install 3.1.57
        ./emsdk activate 3.1.57
        echo "$HOME/emsdk" >> "$GITHUB_PATH"
        echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Create .env file
      run: |
        cat > .env << EOF
        PORT=${{ secrets.PORT }}
        DB_HOST=${{ secrets.DB_HOST }}
        DB_PORT=${{ secrets.DB_PORT }}
        DB_USER=${{ secrets.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_NAME=${{ secrets.DB_NAME }}
        REDIS_HOST=${{ secrets.REDIS_HOST }}
        REDIS_PORT=${{ secrets.REDIS_PORT }}
        REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
        REDIS_DB=${{ secrets.REDIS_DB }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
        ADMIN_USER=${{ secrets.ADMIN_USER }}
        ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
        BASE_URL=${{ secrets.BASE_URL }}
        DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
        EOF

    - name: Create SSL certificates
      run: |
        mkdir -p ssl
        echo "${{ secrets.KEY }}" > ssl/md.yhsun.cn.key
        echo "${{ secrets.PEM }}" > ssl/md.yhsun.cn.pem

    - name: Build frontend
      run: npm run build

    - name: Verify WASM packaged in dist
      run: npm run wasm:text:verify:dist && npm run wasm:image:verify:dist

    - name: Capture WASM checksums
      id: wasm_checksums
      run: |
        echo "text_js_sha256=$(sha256sum dist/wasm_text_engine/text_engine.js | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "text_wasm_sha256=$(sha256sum dist/wasm_text_engine/text_engine.wasm | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "image_js_sha256=$(sha256sum dist/wasm_text_engine/image_compressor.js | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "image_wasm_sha256=$(sha256sum dist/wasm_text_engine/image_compressor.wasm | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Download verified Python sandbox image
      uses: actions/download-artifact@v4
      with:
        name: python-sandbox-image
        path: python-sandbox-image

    - name: Create deployment tarball
      run: |
        mkdir -p deploy_tmp
        cp -r dist api print shared sandbox requirements.txt package.json package-lock.json nginx.conf sw.ts manifest.webmanifest icon.png .env ssl deploy_tmp/

        (cd python-sandbox-image && sha256sum -c python-sandbox.tar.gz.sha256)
        cp python-sandbox-image/python-sandbox.tar.gz python-sandbox-image/python-sandbox.tar.gz.sha256 python-sandbox-image/python-sandbox.image.json deploy_tmp/sandbox/python/

        # 复制 reference-docs 和 scripts
        if [ -d "reference-docs" ]; then
          cp -r reference-docs deploy_tmp/
        fi
        if [ -d "scripts" ]; then
          cp -r scripts deploy_tmp/
        fi

        # Install only locked runtime dependencies on the runner, never on the server.
        npm ci --prefix deploy_tmp --omit=dev --prefer-offline --no-audit --no-fund
        (cd deploy_tmp && ./node_modules/.bin/tsx --version && node -e "require('sharp'); require('esbuild').transformSync('const n: number = 1', {loader: 'ts'});")
        tar -czf deploy.tar.gz -C deploy_tmp .

    - name: Prepare and execute zero-downtime deployment
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 120s
        script: |
          set -e
          export PATH="${{ env.REMOTE_NODE_BIN }}:$PATH"

          node -e "if (process.platform !== 'linux' || process.arch !== 'x64' || process.versions.node.split('.')[0] !== '24' || !process.report.getReport().header.glibcVersionRuntime) { console.error('部署包需要 Linux x64 / glibc / Node 24'); process.exit(1); }"

          # 定义目录
          GREEN_DIR="/www/wwwroot/js_green"
          BLUE_DIR="/www/wwwroot/js_blue"
          SHARED_DIR="/www/wwwroot/js_shared"
          LINK_PATH="/www/wwwroot/js"

          # 创建必要的目录
          mkdir -p "$GREEN_DIR" "$BLUE_DIR" "$SHARED_DIR/uploads" "$SHARED_DIR/user_uploads" "$SHARED_DIR/user_files"

          # 确定当前和下一个部署目录
          if [ -L "$LINK_PATH" ]; then
            CURRENT_TARGET=$(readlink -f "$LINK_PATH")
            if [ "$CURRENT_TARGET" = "$GREEN_DIR" ]; then
              NEXT_DIR="$BLUE_DIR"
              NEXT_NAME="md-server-blue"
              CURRENT_NAME="md-server-green"
              echo "当前: green -> 切换到: blue"
            else
              NEXT_DIR="$GREEN_DIR"
              NEXT_NAME="md-server-green"
              CURRENT_NAME="md-server-blue"
              echo "当前: blue -> 切换到: green"
            fi
          else
            NEXT_DIR="$GREEN_DIR"
            NEXT_NAME="md-server-green"
            CURRENT_NAME=""
            echo "首次部署到: green"
          fi

          # 清理下一个部署目录
          echo "清理 $NEXT_DIR..."
          find "${NEXT_DIR:?}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          # 等待上传文件（文件会通过 SCP 上传到临时位置）
          echo "等待部署包..."

    - name: Upload deployment tarball
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        command_timeout: 20m
        source: "deploy.tar.gz"
        target: "/tmp/easypocketmd-deploy-${{ github.run_id }}-${{ github.run_attempt }}"
        strip_components: 0

    - name: Extract and setup deployment
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 30s
        command_timeout: 20m
        script: |
          set -e
          export PATH="${{ env.REMOTE_NODE_BIN }}:$PATH"

          GREEN_DIR="/www/wwwroot/js_green"
          BLUE_DIR="/www/wwwroot/js_blue"
          SHARED_DIR="/www/wwwroot/js_shared"
          LINK_PATH="/www/wwwroot/js"

          # 确定目标目录
          if [ -L "$LINK_PATH" ]; then
            CURRENT_TARGET=$(readlink -f "$LINK_PATH")
            if [ "$CURRENT_TARGET" = "$GREEN_DIR" ]; then
              NEXT_DIR="$BLUE_DIR"
            else
              NEXT_DIR="$GREEN_DIR"
            fi
          else
            NEXT_DIR="$GREEN_DIR"
          fi

          echo "[1/4] 解压部署包到 $NEXT_DIR..."
          # 使用超时机制解压，避免卡死
          timeout 300 tar -xzf /tmp/easypocketmd-deploy-${{ github.run_id }}-${{ github.run_attempt }}/deploy.tar.gz -C "$NEXT_DIR" || {
            echo "错误: 解压超时或失败"
            exit 1
          }
          echo "✓ 解压完成"

          # 设置共享目录符号链接
          echo "[2/4] 设置共享目录符号链接..."
          cd "$NEXT_DIR"
          rm -rf uploads user_uploads user_files
          ln -s "$SHARED_DIR/uploads" uploads
          ln -s "$SHARED_DIR/user_uploads" user_uploads
          ln -s "$SHARED_DIR/user_files" user_files
          echo "✓ 符号链接创建完成"

          # Runtime dependencies are part of the release; fail before switching traffic.
          echo "[3/4] 验证预安装运行依赖..."
          test -x node_modules/.bin/tsx
          ./node_modules/.bin/tsx --version
          node -e "require('sharp'); require('esbuild').transformSync('const n: number = 1', {loader: 'ts'});"
          echo "✓ 运行依赖验证完成（服务器无需执行 npm 安装）"

          bash api/utils/ensure-export-tools.sh

          # 安装 Python 依赖：DOCX 模板生成 + MarkItDown 导入转换
          echo "[5/5] 安装 Python 依赖..."
          if command -v python3 &> /dev/null; then
            PYTHON_CMD=python3
          elif command -v python &> /dev/null; then
            PYTHON_CMD=python
          else
            echo "错误: 未找到 Python，文档导入转换功能无法使用"
            exit 1
          fi
          
          if [ -n "$PYTHON_CMD" ]; then
            echo "使用 Python: $PYTHON_CMD"
            $PYTHON_CMD -m venv .venv
            source .venv/bin/activate
            export PIP_INDEX_URL="${{ vars.SERVER_PIP_INDEX_URL || 'https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple' }}"
            export PIP_CONFIG_FILE=/dev/null
            export PIP_EXTRA_INDEX_URL=
            python -m pip install --upgrade pip -q
            if [ -f "requirements.txt" ]; then
              python -m pip install -r requirements.txt -q
            else
              python -m pip install python-docx "markitdown[all]" -q
            fi
            python -c "from markitdown import MarkItDown; print('MarkItDown ready')"
          fi
          
          bash scripts/setup-python-sandbox.sh --load sandbox/python/python-sandbox.tar.gz

          echo "✓ 部署目录准备完成: $NEXT_DIR"

    - name: Zero-downtime switch
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 300s
        script: |
          set -e
          export PATH="${{ env.REMOTE_NODE_BIN }}:$PATH"
          PM2_BIN="${{ env.REMOTE_NODE_BIN }}/pm2"

          GREEN_DIR="/www/wwwroot/js_green"
          BLUE_DIR="/www/wwwroot/js_blue"
          LINK_PATH="/www/wwwroot/js"

          # 确定当前和下一个部署
          if [ -L "$LINK_PATH" ]; then
            CURRENT_TARGET=$(readlink -f "$LINK_PATH")
            if [ "$CURRENT_TARGET" = "$GREEN_DIR" ]; then
              NEXT_DIR="$BLUE_DIR"
              NEXT_NAME="md-server-blue"
              CURRENT_NAME="md-server-green"
            else
              NEXT_DIR="$GREEN_DIR"
              NEXT_NAME="md-server-green"
              CURRENT_NAME="md-server-blue"
            fi
          else
            NEXT_DIR="$GREEN_DIR"
            NEXT_NAME="md-server-green"
            CURRENT_NAME=""
          fi

          echo "在新目录启动服务: $NEXT_NAME"
          cd "$NEXT_DIR"

          # 根据服务名称设置端口
          if [ "$NEXT_NAME" = "md-server-green" ]; then
            NEXT_PORT=3050
          else
            NEXT_PORT=3051
          fi
          echo "服务 $NEXT_NAME 将使用端口: $NEXT_PORT"

          # Only recycle the inactive slot; keep the current service alive until checks pass.
          "$PM2_BIN" delete "$NEXT_NAME" 2>/dev/null || true

          # 检查敏感词文件是否存在
          echo "检查敏感词文件..."
          if [ ! -f "/www/wwwroot/static/sensitive.txt" ]; then
            echo "⚠️ 警告: 敏感词文件不存在，敏感词检测功能将不可用"
          else
            echo "✓ 敏感词文件已存在"
          fi

          # 启动新服务
          echo "启动新服务: $NEXT_NAME"
          cd "$NEXT_DIR"

          # 导出所有必需的环境变量
          export PORT=$NEXT_PORT
          export DB_HOST=${{ secrets.DB_HOST }}
          export DB_PORT=${{ secrets.DB_PORT }}
          export DB_USER=${{ secrets.DB_USER }}
          export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          export DB_NAME=${{ secrets.DB_NAME }}
          export REDIS_HOST=${{ secrets.REDIS_HOST }}
          export REDIS_PORT=${{ secrets.REDIS_PORT }}
          export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          export REDIS_DB=${{ secrets.REDIS_DB }}
          export JWT_SECRET=${{ secrets.JWT_SECRET }}
          export JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          export ADMIN_USER=${{ secrets.ADMIN_USER }}
          export ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          export BASE_URL=${{ secrets.BASE_URL }}
          export DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
          export MARKITDOWN_PYTHON="$NEXT_DIR/.venv/bin/python"

          TSX_BIN="$NEXT_DIR/node_modules/.bin/tsx"
          if [ ! -x "$TSX_BIN" ]; then
            echo "错误: 未找到 tsx 可执行文件: $TSX_BIN"
            exit 1
          fi

          # 明确用 Node + tsx 运行 TS，避免 PM2 试图使用 bun 解释器
          "$PM2_BIN" start "$TSX_BIN" --name "$NEXT_NAME" --env production -- api/server.ts

          # 等待服务启动
          echo "等待服务启动..."
          sleep 5
          
          # 验证服务健康状态
          echo "验证服务健康状态..."
          HEALTH_OK=false
          for i in {1..10}; do
            if curl --max-time 5 -fsS http://localhost:$NEXT_PORT/api/health | grep -q '"code":200'; then
              HEALTH_OK=true
              echo "✓ 服务健康检查通过"
              break
            fi
            echo "等待服务就绪... ($i/10)"
            sleep 2
          done

          if [ "$HEALTH_OK" != true ]; then
            "$PM2_BIN" delete "$NEXT_NAME" 2>/dev/null || true
            echo "错误: 新服务健康检查失败，保留旧服务"
            exit 1
          fi

          # 校验 WASM 产物是否为本次构建版本，避免旧产物被错误复用
          echo "校验 WASM 产物版本与完整性..."
          EXPECTED_TEXT_JS_SHA="${{ steps.wasm_checksums.outputs.text_js_sha256 }}"
          EXPECTED_TEXT_WASM_SHA="${{ steps.wasm_checksums.outputs.text_wasm_sha256 }}"
          EXPECTED_IMAGE_JS_SHA="${{ steps.wasm_checksums.outputs.image_js_sha256 }}"
          EXPECTED_IMAGE_WASM_SHA="${{ steps.wasm_checksums.outputs.image_wasm_sha256 }}"
          ACTIVE_TEXT_JS="$NEXT_DIR/dist/wasm_text_engine/text_engine.js"
          ACTIVE_TEXT_WASM="$NEXT_DIR/dist/wasm_text_engine/text_engine.wasm"
          ACTIVE_IMAGE_JS="$NEXT_DIR/dist/wasm_text_engine/image_compressor.js"
          ACTIVE_IMAGE_WASM="$NEXT_DIR/dist/wasm_text_engine/image_compressor.wasm"

          if [ ! -f "$ACTIVE_TEXT_JS" ] || [ ! -f "$ACTIVE_TEXT_WASM" ]; then
            echo "错误: 部署目录中缺少 text_engine WASM 产物"
            ls -la "$NEXT_DIR/dist/wasm_text_engine" || true
            exit 1
          fi

          if [ ! -f "$ACTIVE_IMAGE_JS" ] || [ ! -f "$ACTIVE_IMAGE_WASM" ]; then
            echo "错误: 部署目录中缺少 image_compressor WASM 产物"
            ls -la "$NEXT_DIR/dist/wasm_text_engine" || true
            exit 1
          fi

          ACTUAL_TEXT_JS_SHA=$(sha256sum "$ACTIVE_TEXT_JS" | awk '{print $1}')
          ACTUAL_TEXT_WASM_SHA=$(sha256sum "$ACTIVE_TEXT_WASM" | awk '{print $1}')
          if [ "$ACTUAL_TEXT_JS_SHA" != "$EXPECTED_TEXT_JS_SHA" ] || [ "$ACTUAL_TEXT_WASM_SHA" != "$EXPECTED_TEXT_WASM_SHA" ]; then
            echo "错误: 部署目录 text_engine WASM 校验失败"
            echo "expected js:   $EXPECTED_TEXT_JS_SHA"
            echo "actual js:     $ACTUAL_TEXT_JS_SHA"
            echo "expected wasm: $EXPECTED_TEXT_WASM_SHA"
            echo "actual wasm:   $ACTUAL_TEXT_WASM_SHA"
            exit 1
          fi

          ACTUAL_IMAGE_JS_SHA=$(sha256sum "$ACTIVE_IMAGE_JS" | awk '{print $1}')
          ACTUAL_IMAGE_WASM_SHA=$(sha256sum "$ACTIVE_IMAGE_WASM" | awk '{print $1}')
          if [ "$ACTUAL_IMAGE_JS_SHA" != "$EXPECTED_IMAGE_JS_SHA" ] || [ "$ACTUAL_IMAGE_WASM_SHA" != "$EXPECTED_IMAGE_WASM_SHA" ]; then
            echo "错误: 部署目录 image_compressor WASM 校验失败"
            echo "expected js:   $EXPECTED_IMAGE_JS_SHA"
            echo "actual js:     $ACTUAL_IMAGE_JS_SHA"
            echo "expected wasm: $EXPECTED_IMAGE_WASM_SHA"
            echo "actual wasm:   $ACTUAL_IMAGE_WASM_SHA"
            exit 1
          fi
          echo "✓ 部署目录 WASM 校验通过"

          TMP_WASM_DIR="/tmp/md_wasm_probe"
          rm -rf "$TMP_WASM_DIR"
          mkdir -p "$TMP_WASM_DIR"
          curl -fsS "http://127.0.0.1:$NEXT_PORT/wasm_text_engine/text_engine.js" -o "$TMP_WASM_DIR/text_engine.js"
          curl -fsS "http://127.0.0.1:$NEXT_PORT/wasm_text_engine/text_engine.wasm" -o "$TMP_WASM_DIR/text_engine.wasm"
          curl -fsS "http://127.0.0.1:$NEXT_PORT/wasm_text_engine/image_compressor.js" -o "$TMP_WASM_DIR/image_compressor.js"
          curl -fsS "http://127.0.0.1:$NEXT_PORT/wasm_text_engine/image_compressor.wasm" -o "$TMP_WASM_DIR/image_compressor.wasm"

          SERVED_TEXT_JS_SHA=$(sha256sum "$TMP_WASM_DIR/text_engine.js" | awk '{print $1}')
          SERVED_TEXT_WASM_SHA=$(sha256sum "$TMP_WASM_DIR/text_engine.wasm" | awk '{print $1}')
          SERVED_IMAGE_JS_SHA=$(sha256sum "$TMP_WASM_DIR/image_compressor.js" | awk '{print $1}')
          SERVED_IMAGE_WASM_SHA=$(sha256sum "$TMP_WASM_DIR/image_compressor.wasm" | awk '{print $1}')

          if [ "$SERVED_TEXT_JS_SHA" != "$EXPECTED_TEXT_JS_SHA" ] || [ "$SERVED_TEXT_WASM_SHA" != "$EXPECTED_TEXT_WASM_SHA" ]; then
            echo "错误: HTTP 实际返回的 text_engine WASM 产物与构建版本不一致"
            exit 1
          fi

          if [ "$SERVED_IMAGE_JS_SHA" != "$EXPECTED_IMAGE_JS_SHA" ] || [ "$SERVED_IMAGE_WASM_SHA" != "$EXPECTED_IMAGE_WASM_SHA" ]; then
            echo "错误: HTTP 实际返回的 image_compressor WASM 产物与构建版本不一致"
            exit 1
          fi

          # 二次确认方法完整性，避免出现“methods are incomplete”线上回退
          export TMP_WASM_JS="$TMP_WASM_DIR/text_engine.js"
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; const mod = await import(pathToFileURL(process.env.TMP_WASM_JS).href); const inst = await mod.default({}); const engine = new inst.WasmTextEngine(); const required=['diff','merge3','findInText','normalizePath','parentPath','basenamePath','pathBasename','compareVersions','isHiddenCrossSearchFile','collectFolderPaths']; const missing=required.filter((m)=>typeof engine[m] !== 'function'); if (missing.length) { console.error('WASM 方法缺失:', missing.join(',')); process.exit(1); }"
          echo "✓ HTTP WASM 完整性校验通过"

          # Atomically replace an existing symlink. Preserve a legacy directory on first migration.
          if [ -d "$LINK_PATH" ] && [ ! -L "$LINK_PATH" ]; then
            mv "$LINK_PATH" "${LINK_PATH}_legacy_${{ github.run_id }}"
          fi
          ln -sfn "$NEXT_DIR" "${LINK_PATH}.next"
          mv -Tf "${LINK_PATH}.next" "$LINK_PATH"

          # 配置 SSL 证书
          echo "配置 SSL 证书..."
          CERT_DIR="/www/server/panel/vhost/cert/md.yhsun.cn"
          mkdir -p "$CERT_DIR"
          
          if [ -f "$NEXT_DIR/ssl/md.yhsun.cn.key" ] && [ -f "$NEXT_DIR/ssl/md.yhsun.cn.pem" ]; then
            cp "$NEXT_DIR/ssl/md.yhsun.cn.key" "$CERT_DIR/privkey.pem"
            cp "$NEXT_DIR/ssl/md.yhsun.cn.pem" "$CERT_DIR/fullchain.pem"
            chmod 600 "$CERT_DIR/privkey.pem"
            chmod 644 "$CERT_DIR/fullchain.pem"
            echo "✓ SSL 证书已更新"
          else
            echo "警告: 未找到 SSL 证书文件"
          fi

          # 更新 Nginx 配置
          if [ -f "$NEXT_DIR/nginx.conf" ]; then
            echo "更新 Nginx 配置..."
            cp "$NEXT_DIR/nginx.conf" /www/server/panel/vhost/nginx/md.yhsun.cn.conf
            # 确保 Nginx 配置指向正确的端口（使用当前活动的端口）
            # 同时替换 localhost 和 127.0.0.1 的端口
            sed -i "s/proxy_pass http:\/\/localhost:[0-9]*/proxy_pass http:\/\/localhost:$NEXT_PORT/" /www/server/panel/vhost/nginx/md.yhsun.cn.conf
            sed -i "s/proxy_pass http:\/\/127.0.0.1:[0-9]*/proxy_pass http:\/\/127.0.0.1:$NEXT_PORT/" /www/server/panel/vhost/nginx/md.yhsun.cn.conf
            # 确保 API 路由配置正确
            if ! grep -q "location /api/" /www/server/panel/vhost/nginx/md.yhsun.cn.conf; then
              echo "警告: Nginx 配置中缺少 /api/ 路由配置"
            fi
          fi

          # 重载 Nginx
          if [ -f /etc/init.d/nginx ]; then
            /etc/init.d/nginx reload
          else
            nginx -s reload || service nginx reload
          fi

          # 停止旧服务（如果还有的话）
          if [ -n "$CURRENT_NAME" ]; then
            echo "检查并停止旧服务: $CURRENT_NAME"
            "$PM2_BIN" stop "$CURRENT_NAME" 2>/dev/null || true
            "$PM2_BIN" delete "$CURRENT_NAME" 2>/dev/null || true
          fi

          # 配置 PM2 开机自启（systemd）
          echo "配置 PM2 开机自启..."
          if command -v systemctl > /dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              "$PM2_BIN" startup systemd -u "$USER" --hp "$HOME" || true
            elif command -v sudo > /dev/null 2>&1; then
              sudo env PATH="$PATH:${{ env.REMOTE_NODE_BIN }}" "$PM2_BIN" startup systemd -u "$USER" --hp "$HOME" || true
            else
              echo "⚠️ 非 root 且无 sudo，跳过 PM2 开机自启配置"
            fi
            "$PM2_BIN" save
            echo "✓ PM2 进程列表已保存"
          else
            echo "⚠️ 未检测到 systemd，跳过 PM2 开机自启配置"
          fi

          echo "✓ 零停机部署完成！"
          "$PM2_BIN" list

    - name: Publish version.txt to static
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 60s
        script: |
          set -e
          mkdir -p /www/wwwroot/static
          printf '%s\n' "${{ steps.app_version.outputs.version }}" > /www/wwwroot/static/version.txt
          echo "Published /www/wwwroot/static/version.txt"
          cat /www/wwwroot/static/version.txt

    - name: Setup and start print server (zero-downtime)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 300s
        script: |
          set -e
          export PATH="${{ env.REMOTE_NODE_BIN }}:$PATH"
          PM2_BIN="${{ env.REMOTE_NODE_BIN }}/pm2"

          LINK_PATH="/www/wwwroot/js"
          if [ -L "$LINK_PATH" ]; then
            PRINT_DIR="$(readlink -f "$LINK_PATH")/print"
          else
            PRINT_DIR="/www/wwwroot/js_green/print"
          fi
          echo "打印服务目录: $PRINT_DIR"
          cd "$PRINT_DIR"

          # 检查 Python
          if command -v python3 &> /dev/null; then
            PYTHON_CMD=python3
          elif command -v python &> /dev/null; then
            PYTHON_CMD=python
          else
            echo "错误: 未找到 Python"
            exit 1
          fi

          echo "使用 Python: $PYTHON_CMD"

          # 创建并激活虚拟环境
          echo "创建虚拟环境..."
          $PYTHON_CMD -m venv .venv
          source .venv/bin/activate

          export PIP_INDEX_URL="${{ vars.SERVER_PIP_INDEX_URL || 'https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple' }}"
          export PIP_CONFIG_FILE=/dev/null
          export PIP_EXTRA_INDEX_URL=

          # 安装依赖
          if [ -f "requirements.txt" ]; then
            echo "安装 Python 依赖..."
            pip install --upgrade pip -q
            pip install -r requirements.txt -q
          fi

          # 安装 python-docx 用于创建 reference.docx
          echo "安装 python-docx..."
          pip install python-docx -q

          # 创建 reference.docx 模板
          if [ -f "../scripts/create-reference-docx.py" ]; then
            echo "创建 Pandoc reference.docx 模板..."
            cd ..
            $PYTHON_CMD scripts/create-reference-docx.py || echo "警告: reference.docx 创建失败，将使用默认样式"
            cd print
          fi

          # 获取虚拟环境中的 Python 解释器路径
          VENV_PYTHON="$(pwd)/.venv/bin/python"

          # 必须从当前蓝绿槽位 delete 后重建：pm2 reload 不会更新 cwd/解释器路径，
          # 否则会一直跑首次 start 时所在的 js_green/js_blue 目录里的旧 print_server.py
          echo "重启打印服务器（绑定到当前活动槽位）..."
          if "$PM2_BIN" describe print-server > /dev/null 2>&1; then
            "$PM2_BIN" delete print-server
          fi
          "$PM2_BIN" start print_server.py \
            --name "print-server" \
            --cwd "$PRINT_DIR" \
            --interpreter "$VENV_PYTHON" \
            -- \
            --host 0.0.0.0 --port 3060

          "$PM2_BIN" save
          echo "✓ 打印服务器已切换到 $PRINT_DIR"

    - name: Final cleanup
      if: always()
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 60s
        script: |
          # 清理临时文件
          rm -f /tmp/easypocketmd-deploy-${{ github.run_id }}-${{ github.run_attempt }}/deploy.tar.gz

          echo ""
          echo "=========================================="
          echo "部署流程结束，请以上述步骤状态为准"
          echo "=========================================="
          "${{ env.REMOTE_NODE_BIN }}/pm2" list

  # 检查打印客户端文件是否变更
  check-print-changes:
    if: github.event_name != 'pull_request' && github.event.inputs.action != 'rollback'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.print }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          print:
            - 'print/print_client.py'
            - 'print/print_gui.py'
            - 'print/requirements.txt'

  # 构建打印客户端 GUI 版本（条件执行）
  build-print-client:
    needs: check-print-changes
    if: needs.check-print-changes.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            ext: .exe
          - os: ubuntu-latest
            target: linux
            ext: ''
          - os: macos-latest
            target: macos
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r print/requirements.txt
        pip install pyinstaller

    - name: Build GUI version with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name print_client_${{ matrix.target }} print/print_gui.py

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: print_client_${{ matrix.target }}
        path: dist/print_client_${{ matrix.target }}${{ matrix.ext }}

  # 部署打印客户端到服务器
  deploy-print-client:
    needs: build-print-client
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: print_client_windows
        path: downloads

    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: print_client_linux
        path: downloads

    - name: Download macOS artifact
      uses: actions/download-artifact@v8
      with:
        name: print_client_macos
        path: downloads

    - name: Create target directory
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: mkdir -p /www/wwwroot/static

    - name: Upload to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "downloads/*"
        target: "/www/wwwroot/static"
        strip_components: 1

  # 一键回滚
  rollback:
    concurrency:
      group: easypocketmd-server-deployment
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
    - name: Execute rollback
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 300s
        script: |
          set -e
          export PATH="${{ env.REMOTE_NODE_BIN }}:$PATH"
          PM2_BIN="${{ env.REMOTE_NODE_BIN }}/pm2"

          GREEN_DIR="/www/wwwroot/js_green"
          BLUE_DIR="/www/wwwroot/js_blue"
          LINK_PATH="/www/wwwroot/js"
          NGINX_CONF="/www/server/panel/vhost/nginx/md.yhsun.cn.conf"

          echo "=========================================="
          echo "  开始执行回滚操作"
          echo "=========================================="

          # 检查当前状态
          if [ ! -L "$LINK_PATH" ]; then
            echo "错误: $LINK_PATH 不是软链接"
            exit 1
          fi

          CURRENT_TARGET=$(readlink -f "$LINK_PATH")

          if [ "$CURRENT_TARGET" = "$GREEN_DIR" ]; then
            NEXT_DIR="$BLUE_DIR"
            NEXT_NAME="md-server-blue"
            NEXT_PORT=3051
            CURRENT_NAME="md-server-green"
            echo "当前: green (3050) -> 切换到: blue (3051)"
          elif [ "$CURRENT_TARGET" = "$BLUE_DIR" ]; then
            NEXT_DIR="$GREEN_DIR"
            NEXT_NAME="md-server-green"
            NEXT_PORT=3050
            CURRENT_NAME="md-server-blue"
            echo "当前: blue (3051) -> 切换到: green (3050)"
          else
            echo "错误: 未知的当前部署目录: $CURRENT_TARGET"
            exit 1
          fi

          # 检查目标目录是否存在
          if [ ! -d "$NEXT_DIR" ]; then
            echo "错误: 目标回滚目录不存在: $NEXT_DIR"
            exit 1
          fi

          # 切换软链接
          echo "[1/5] 切换软链接..."
          ln -sfn "$NEXT_DIR" "$LINK_PATH"
          echo "✓ 软链接已更新"

          # 更新 Nginx 配置端口
          echo "[2/5] 更新 Nginx 配置..."
          if [ -f "$NGINX_CONF" ]; then
            sed -i "s/proxy_pass http:\/\/localhost:[0-9]*/proxy_pass http:\/\/localhost:$NEXT_PORT/" "$NGINX_CONF"
            sed -i "s/proxy_pass http:\/\/127.0.0.1:[0-9]*/proxy_pass http:\/\/127.0.0.1:$NEXT_PORT/" "$NGINX_CONF"
            echo "✓ Nginx 端口已更新为: $NEXT_PORT"
          else
            echo "警告: 未找到 Nginx 配置文件: $NGINX_CONF"
          fi

          # 重载 Nginx
          echo "[3/5] 重载 Nginx..."
          if [ -f /etc/init.d/nginx ]; then
            /etc/init.d/nginx reload
          else
            nginx -s reload || service nginx reload
          fi
          echo "✓ Nginx 重载完成"

          # 停止旧服务，启动新服务
          echo "[4/5] 重启 PM2 服务..."

          # 停止所有旧服务
          "$PM2_BIN" stop md-server-green 2>/dev/null || true
          "$PM2_BIN" delete md-server-green 2>/dev/null || true
          "$PM2_BIN" stop md-server-blue 2>/dev/null || true
          "$PM2_BIN" delete md-server-blue 2>/dev/null || true
          sleep 2

          # 清理端口占用
          lsof -ti:$NEXT_PORT | xargs kill -9 2>/dev/null || true
          sleep 1

          # 启动新服务
          cd "$NEXT_DIR"

          # 从 .env 读取环境变量
          if [ -f ".env" ]; then
            export PORT=$NEXT_PORT
            export DB_HOST=$(grep DB_HOST .env | cut -d'=' -f2)
            export DB_PORT=$(grep DB_PORT .env | cut -d'=' -f2)
            export DB_USER=$(grep DB_USER .env | cut -d'=' -f2)
            export DB_PASSWORD=$(grep DB_PASSWORD .env | cut -d'=' -f2)
            export DB_NAME=$(grep DB_NAME .env | cut -d'=' -f2)
            export REDIS_HOST=$(grep REDIS_HOST .env | cut -d'=' -f2)
            export REDIS_PORT=$(grep REDIS_PORT .env | cut -d'=' -f2)
            export REDIS_PASSWORD=$(grep REDIS_PASSWORD .env | cut -d'=' -f2)
            export REDIS_DB=$(grep REDIS_DB .env | cut -d'=' -f2)
            export JWT_SECRET=$(grep JWT_SECRET .env | cut -d'=' -f2)
            export JWT_EXPIRES_IN=$(grep JWT_EXPIRES_IN .env | cut -d'=' -f2)
            export ADMIN_USER=$(grep ADMIN_USER .env | cut -d'=' -f2)
            export ADMIN_PASSWORD=$(grep ADMIN_PASSWORD .env | cut -d'=' -f2)
            export BASE_URL=$(grep BASE_URL .env | cut -d'=' -f2)
            export DASHSCOPE_API_KEY=$(grep DASHSCOPE_API_KEY .env | cut -d'=' -f2)
            export MARKITDOWN_PYTHON="$NEXT_DIR/.venv/bin/python"
          else
            export PORT=$NEXT_PORT
            export DB_HOST=${{ secrets.DB_HOST }}
            export DB_PORT=${{ secrets.DB_PORT }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export DB_NAME=${{ secrets.DB_NAME }}
            export REDIS_HOST=${{ secrets.REDIS_HOST }}
            export REDIS_PORT=${{ secrets.REDIS_PORT }}
            export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            export REDIS_DB=${{ secrets.REDIS_DB }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            export ADMIN_USER=${{ secrets.ADMIN_USER }}
            export ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            export BASE_URL=${{ secrets.BASE_URL }}
            export DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}
            export MARKITDOWN_PYTHON="$NEXT_DIR/.venv/bin/python"
          fi

          TSX_BIN="$NEXT_DIR/node_modules/.bin/tsx"
          if [ ! -x "$TSX_BIN" ]; then
            echo "错误: 未找到 tsx 可执行文件: $TSX_BIN"
            exit 1
          fi

          "$PM2_BIN" start "$TSX_BIN" --name "$NEXT_NAME" --env production -- api/server.ts
          echo "✓ 服务已启动: $NEXT_NAME"

          # 健康检查
          echo "[5/5] 执行健康检查..."
          HEALTH_OK=false
          for i in {1..10}; do
            if curl -s http://localhost:$NEXT_PORT/api/health | grep -q '"code":200'; then
              HEALTH_OK=true
              echo "✓ 服务健康检查通过"
              break
            fi
            echo "等待服务就绪... ($i/10)"
            sleep 2
          done

          if [ "$HEALTH_OK" = false ]; then
            echo "⚠️ 警告: 健康检查未通过，请手动检查服务状态"
          fi

          # 保存 PM2 状态
          "$PM2_BIN" save

          echo ""
          echo "=========================================="
          echo "✓ 回滚完成！当前运行版本:"
          echo "=========================================="
          "$PM2_BIN" list
          echo ""
          echo "服务名: $NEXT_NAME"
          echo "端口: $NEXT_PORT"
          echo "目录: $NEXT_DIR"

