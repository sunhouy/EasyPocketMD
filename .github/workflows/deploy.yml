name: CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布到 GitHub Release 的 tag（例如 v1.2.3；留空则使用当前 ref 的 tag）'
        required: false
        type: string

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup Emscripten
      run: |
        if [ ! -d "$HOME/emsdk" ]; then
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
        fi
        cd "$HOME/emsdk"
        ./emsdk install 3.1.57
        ./emsdk activate 3.1.57
        echo "$HOME/emsdk" >> "$GITHUB_PATH"
        echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Build WASM text engine
      run: npm run wasm:text:build

    - name: Build WASM image compressor
      run: npm run wasm:image:build

    - name: Verify WASM source artifacts
      run: npm run wasm:text:verify && npm run wasm:image:verify

    - name: Build and verify isolated Python runner
      run: |
        bash scripts/setup-python-sandbox.sh --build
        npx tsx scripts/check-python-sandbox.ts
        bash scripts/export-python-sandbox.sh "$RUNNER_TEMP/python-sandbox-image"
        bash scripts/setup-python-sandbox.sh --load "$RUNNER_TEMP/python-sandbox-image/python-sandbox.tar.gz"

    - name: Verify sandbox image in a separate Docker engine
      timeout-minutes: 5
      run: bash scripts/check-sandbox-image-portability.sh "$RUNNER_TEMP/python-sandbox-image"

    - name: Upload verified Python sandbox image
      uses: actions/upload-artifact@v4
      with:
        name: python-sandbox-image
        path: ${{ runner.temp }}/python-sandbox-image/
        compression-level: 0
        retention-days: 3
        if-no-files-found: error

    - name: Run tests
      run: npm test -- --coverage

    - name: Verify locked production dependencies
      run: |
        RUNTIME_DIR="$RUNNER_TEMP/easypocketmd-runtime"
        mkdir -p "$RUNTIME_DIR"
        cp package.json package-lock.json "$RUNTIME_DIR/"
        npm ci --prefix "$RUNTIME_DIR" --omit=dev --prefer-offline --no-audit --no-fund
        cd "$RUNTIME_DIR"
        ./node_modules/.bin/tsx --version
        node -e "require('sharp'); require('esbuild').transformSync('const n: number = 1', {loader: 'ts'});"

    - name: Verify frontend build
      run: npm run build:web && npm run wasm:text:verify:dist && npm run wasm:image:verify:dist

    
        
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-deploy.yml
    with:
      channel: main
    secrets: inherit

  # 检查打印客户端文件是否变更
  check-print-changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.print }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          print:
            - 'print/print_client.py'
            - 'print/print_gui.py'
            - 'print/requirements.txt'

  # 构建打印客户端 GUI 版本（条件执行）
  build-print-client:
    needs: check-print-changes
    if: needs.check-print-changes.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            ext: .exe
          - os: ubuntu-latest
            target: linux
            ext: ''
          - os: macos-latest
            target: macos
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r print/requirements.txt
        pip install pyinstaller

    - name: Build GUI version with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name print_client_${{ matrix.target }} print/print_gui.py

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: print_client_${{ matrix.target }}
        path: dist/print_client_${{ matrix.target }}${{ matrix.ext }}

  # 部署打印客户端到服务器
  deploy-print-client:
    needs: build-print-client
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: print_client_windows
        path: downloads

    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: print_client_linux
        path: downloads

    - name: Download macOS artifact
      uses: actions/download-artifact@v8
      with:
        name: print_client_macos
        path: downloads

    - name: Create target directory
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: mkdir -p /www/wwwroot/static

    - name: Upload to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "downloads/*"
        target: "/www/wwwroot/static"
        strip_components: 1

    - name: Create US static download directory
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.IP_US }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSHKEY_US }}
        script: mkdir -p /www/wwwroot/static

    - name: Upload print clients to US server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.IP_US }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSHKEY_US }}
        source: "downloads/*"
        target: "/www/wwwroot/static"
        strip_components: 1
