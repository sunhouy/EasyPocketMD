name: Docker deployment (offline incremental images)
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    concurrency:
      group: easypocketmd-server-deployment
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v6
    - name: Install SSH transfer tools on CI
      run: sudo apt-get update && sudo apt-get install -y sshpass rsync
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - name: Setup Emscripten
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        cd "$RUNNER_TEMP/emsdk"
        ./emsdk install 3.1.57
        ./emsdk activate 3.1.57
        echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
    - name: Build frontend in CI
      run: npm ci --prefer-offline --no-audit --no-fund && npm run build
    - name: Download verified Python sandbox image
      uses: actions/download-artifact@v4
      with:
        name: python-sandbox-image
        path: python-sandbox-image
    - name: Load verified sandbox on CI
      run: |
        bash scripts/setup-python-sandbox.sh --load python-sandbox-image/python-sandbox.tar.gz
        docker tag easypocketmd-python:1 easypocketmd-python:${{ github.sha }}
    - uses: docker/setup-buildx-action@v3
    - name: Build application image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/Dockerfile
        target: app
        platforms: linux/amd64
        load: true
        tags: easypocketmd-app:${{ github.sha }}
        cache-from: type=gha,scope=epmd-app
        cache-to: type=gha,scope=epmd-app,mode=max,ignore-error=true
    - name: Build print service image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/Dockerfile
        target: print
        platforms: linux/amd64
        load: true
        tags: easypocketmd-print:${{ github.sha }}
        cache-from: type=gha,scope=epmd-print
        cache-to: type=gha,scope=epmd-print,mode=max,ignore-error=true
    - name: Build application gateway image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/Dockerfile
        target: gateway
        platforms: linux/amd64
        load: true
        tags: easypocketmd-gateway:${{ github.sha }}
        cache-from: type=gha,scope=epmd-gateway
        cache-to: type=gha,scope=epmd-gateway,mode=max,ignore-error=true
    - name: Validate origin and edge gateway configurations before transfer
      run: |
        docker run --rm --pull=never --network=none \
          -e APP_PORT=3150 -e PRINT_PORT=3160 -e GATEWAY_PORT=3180 -e PRINT_GATEWAY_PORT=3182 \
          easypocketmd-gateway:${{ github.sha }} nginx -t
        docker run --rm --pull=never --network=none \
          -e NGINX_ENVSUBST_TEMPLATE_SUFFIX=.edge -e GATEWAY_PORT=3180 \
          -e ORIGIN_IP=192.0.2.1 -e ORIGIN_HOST=md.example.com -e ORIGIN_TLS_VERIFY=on \
          easypocketmd-gateway:${{ github.sha }} nginx -t
    - name: Export content-addressed images
      run: |
        python3 scripts/image-cas.py export image-cas \
          app=easypocketmd-app:${{ github.sha }} \
          print=easypocketmd-print:${{ github.sha }} \
          gateway=easypocketmd-gateway:${{ github.sha }} \
          python=easypocketmd-python:${{ github.sha }}
    - name: Prepare private runtime configuration
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        REDIS_HOST: ${{ secrets.REDIS_HOST }}
        REDIS_PORT: ${{ secrets.REDIS_PORT }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        REDIS_DB: ${{ secrets.REDIS_DB }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        ADMIN_USER: ${{ secrets.ADMIN_USER }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        BASE_URL: ${{ inputs.channel == 'dev' && (secrets.DEV_BASE_URL || 'https://dev.yhsun.cn') || (secrets.BASE_URL || 'https://md.yhsun.cn') }}
        TLS_KEY: ${{ inputs.channel == 'main' && secrets.KEY || '' }}
        TLS_PEM: ${{ inputs.channel == 'main' && secrets.PEM || '' }}
        SSL_EMAIL: ${{ secrets.SSL_EMAIL }}
      run: |
        python3 scripts/prepare-docker-release.py
        if [ '${{ inputs.channel }}' = dev ]; then
          openssl req -x509 -newkey rsa:4096 -keyout docker-control/tls.key -out docker-control/tls.pem -days 365 -nodes -subj '/CN=dev.yhsun.cn'
        fi
    - name: Prepare regional edge configuration
      env:
        ORIGIN_IP: ${{ secrets.SERVER_HOST }}
      run: python3 scripts/prepare-edge-release.py
    - name: Transfer missing image objects and activate Docker release
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        SERVER_SSH_HOST_KEY: ${{ secrets.SERVER_SSH_HOST_KEY }}
        IP_US: ${{ secrets.IP_US }}
        SSHKEY_US: ${{ secrets.SSHKEY_US }}
        DOMESTIC_DEPLOY_PROVIDER: ${{ vars.DOMESTIC_DEPLOY_PROVIDER }}
      run: |
        test -n "$IP_US" && test -n "$SSHKEY_US"
        umask 077
        key_file="$RUNNER_TEMP/epmd-us-key"
        config_file="$RUNNER_TEMP/epmd-origin-ssh-config"
        trap 'rm -f "$key_file" "$config_file"' EXIT
        printf '%s\n' "$SSHKEY_US" > "$key_file"
        original_pid=''
        if [ "$DOMESTIC_DEPLOY_PROVIDER" = atomgit ]; then
          echo 'Domestic deployment is managed by AtomGit; GitHub deploys only the US edge.'
        else
          python3 -u scripts/select-deploy-route.py "$key_file" "$config_file"
          SERVER_SSH_CONFIG_FILE="$config_file" bash scripts/transfer-docker-release.sh '${{ inputs.channel }}' deploy &
          original_pid=$!
        fi
        DEPLOY_TARGET_LABEL=us SERVER_HOST="$IP_US" SERVER_SSH_HOST_KEY='' SERVER_SSH_KEY_FILE="$key_file" \
          DEPLOY_CONTROL_DIR=docker-control-us DEPLOY_IMAGE_DIR=image-cas-us \
          bash scripts/transfer-docker-release.sh '${{ inputs.channel }}' deploy &
        us_pid=$!
        status=0
        if [ -n "$original_pid" ]; then wait "$original_pid" || status=1; fi
        wait "$us_pid" || status=1
        exit "$status"
    - name: Remove private CI configuration
      if: always()
      run: rm -rf docker-control docker-control-us "$RUNNER_TEMP/epmd-us-key" "$RUNNER_TEMP/epmd-origin-ssh-config"
