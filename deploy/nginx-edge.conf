# Pin the origin IP: resolving the public hostname could route back to this edge.
server {
    listen 127.0.0.1:${GATEWAY_PORT};
    server_name _;
    client_max_body_size 100m;
    location = /deployment-route.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        return 200 '{"route":"overseas"}';
    }
    root /usr/share/nginx/html;
    location /static/ { alias /www/wwwroot/static/; }
    location ~ ^/(api|uploads|user_uploads|user_files|avatars|screenshots|vditor|fa)(/|$) {
        proxy_pass https://${ORIGIN_IP};
        proxy_ssl_server_name on;
        proxy_ssl_name ${ORIGIN_HOST};
        proxy_ssl_verify ${ORIGIN_TLS_VERIFY};
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_http_version 1.1;
        proxy_set_header Host ${ORIGIN_HOST};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location = /sw.ts { return 301 /sw.js; }
    location / { try_files $uri $uri/ /index.html; }
}
